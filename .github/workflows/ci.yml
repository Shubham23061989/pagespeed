name: CI pipeline practice

on:
  push:
    branches:
      - practice/ci-cd
jobs:
    build:
      runs-on: ubuntu-latest
      
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v3
          with:
            node-version: '20'

        - name: Install dependencies
          run: npm install  

        - name: Check node version
          run: node -v

        - name: List files
          run: ls -la

        - name: Build project
          run: npm run build

        - name: List files
          run: ls -la
          